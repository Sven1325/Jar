name: Build ServerExtras

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Plugin bauen
        run: mvn -B package

      - name: Jar als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ServerExtras
          path: target/ServerExtras.jar

      # Bei einem Tag (z. B. v1.0.0) zusaetzlich ein Release mit der Jar anlegen
      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/ServerExtras.jar
